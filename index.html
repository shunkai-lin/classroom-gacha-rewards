<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班級加分扭蛋機</title>
<style>
  :root {
    --pink: #ff6fa5;
    --yellow: #ffd23f;
    --blue: #4cc9f0;
    --green: #6fd66f;
    --purple: #b388ff;
    --bg: #fff7ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif;
    background: linear-gradient(135deg, #fff7ec, #ffe9d6);
    background-size: cover;
    background-attachment: fixed;
    min-height: 100vh;
    padding: 16px;
    color: #4a3b32;
    transition: background 0.4s;
  }
  body.bg-comic-1 {
    background:
      radial-gradient(circle, rgba(255,255,255,0.85) 2px, transparent 2.5px) 0 0/22px 22px,
      linear-gradient(135deg, #ffd23f, #ff8a65);
  }
  body.bg-comic-2 {
    background:
      repeating-conic-gradient(from 0deg, rgba(255,255,255,0.9) 0deg 4deg, transparent 4deg 16deg),
      radial-gradient(circle at 50% 50%, #ff6fa5, #b388ff);
  }
  body.bg-comic-3 {
    background:
      radial-gradient(circle, rgba(255,255,255,0.8) 3px, transparent 3.5px) 0 0/30px 30px,
      linear-gradient(135deg, #4cc9f0, #6fd66f);
  }
  body.bg-comic-4 {
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0 6px, transparent 6px 18px),
      linear-gradient(135deg, #ff6fa5, #ffd23f);
  }
  body.bg-comic-5 {
    background:
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.5) 0 6px, transparent 6px 18px),
      linear-gradient(135deg, #6fd66f, #4cc9f0);
  }
  body.bg-comic-6 {
    background:
      radial-gradient(circle, rgba(255,255,255,0.85) 2px, transparent 2.5px) 0 0/18px 18px,
      radial-gradient(circle, rgba(255,255,255,0.85) 2px, transparent 2.5px) 9px 9px/18px 18px,
      linear-gradient(135deg, #b388ff, #ff6fa5);
  }
  body.bg-comic-7 {
    background:
      repeating-conic-gradient(from 45deg, rgba(255,255,255,0.85) 0deg 3deg, transparent 3deg 12deg),
      radial-gradient(circle at 30% 30%, #ffd23f, #ff8a65);

  body.bg-comic-8 {

  body.bg-comic-9 {

  body.bg-comic-10 {

      repeating-conic-gradient(from 0deg, rgba(255,255,255,0.9) 0deg 5deg, transparent 5deg 20deg),

  button {
    cursor: pointer;

    font-weight: bold;
    padding: 12px 20px;

  button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
  .btn-main { background: var(--blue); color: white; }
  .btn-warn { background: #ff8a65; color: white; }
  .btn-add-student { background: var(--green); color: white; }

  .grid {

    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;

    margin: 0 auto;

  .card {

  .card .name-input {

    margin: 12px 0;
  }
  .score {
    font-size: 2.4rem;
    font-weight: bold;

  .score-btns { display: flex; flex-direction: column; gap: 6px; }

    width: 44px; height: 44px;

    height: 14px;

    height: 100%;
    background: linear-gradient(90deg, var(--yellow), var(--pink));

  .remove-student {

    font-size: 1.1rem;

    object-fit: contain;

    background: linear-gradient(135deg, #ffb347, #ff7043);
    color: #fff;
    font-size: 0.85rem;
    font-weight: bold;
    border-radius: 999px;

  .collection-series {

    color: #b09a8a;

  .collection-empty {

  .levelup-note {
    font-size: 1.2rem;
    font-weight: bold;
    color: #ff7043;
    margin-top: 6px;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 24px;
    padding: 30px;
    max-width: 90%;

    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);

    color: white;

    border-radius: 10px;

  .modal-close {
    background: #ccc;
    color: #333;
    margin-top: 10px;
  }
  footer {
    text-align: center;
    margin-top: 40px;
    color: #b09a8a;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<script src="pokemon-data.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQll2Xvf321l3c9WYQehXFinMXY6u8LGc",
  authDomain: "classroom-gacha-rewards.firebaseapp.com",
  projectId: "classroom-gacha-rewards",
  storageBucket: "classroom-gacha-rewards.firebasestorage.app",
  messagingSenderId: "508693241214",
  appId: "1:508693241214:web:8d8c0dbb5ee0dfca5de72f"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const CLASS_CODE_KEY = "gacha_class_code";
const GOAL = 10;

// ── 扭蛋池：七個角色系列 ＋ 老師自訂的文字獎品 ──────────────────────
// weight 是「系列」被抽中的相對機率：先決定系列，再從該系列裡等機率抽一隻。
// 不把全部角色混在一起平均抽，是因為各系列角色數量差很多；先抽系列，
// 再從該系列等機率抽一位，才能讓小系列也有合理的出現與升級機會。
// 要調整比例直接改 weight；改成 0 就等於關掉那個系列。
const SERIES = [
  { key: "pokemon",    label: "寶可夢",       weight: 14, list: () => (typeof POKEMON_LIST    !== "undefined" ? POKEMON_LIST    : []) },
  { key: "acnh",       label: "動物森友會",   weight: 14, list: () => (typeof ACNH_LIST       !== "undefined" ? ACNH_LIST       : []) },
  { key: "sailormoon", label: "美少女戰士",   weight: 14, list: () => (typeof SAILORMOON_LIST !== "undefined" ? SAILORMOON_LIST : []) },
  { key: "mario",      label: "瑪利歐系列",   weight: 14, list: () => (typeof MARIO_LIST      !== "undefined" ? MARIO_LIST      : []) },
  { key: "spiderman",  label: "蜘蛛人系列",   weight: 14, list: () => (typeof SPIDERMAN_LIST  !== "undefined" ? SPIDERMAN_LIST  : []) },
  { key: "pixar",      label: "皮克斯動畫",   weight: 14, list: () => (typeof PIXAR_LIST      !== "undefined" ? PIXAR_LIST      : []) },
  { key: "princess",   label: "迪士尼公主",   weight: 14, list: () => (typeof PRINCESS_LIST   !== "undefined" ? PRINCESS_LIST   : []) }
];
const TEXT_PRIZE_WEIGHT = 2;   // 老師自訂的實體獎品（貼紙、飲料⋯）約 2% 機率

const SERIES_LABEL = Object.fromEntries(SERIES.map(s => [s.key, s.label]));

// 從加權池抽一件獎品；回傳 { type, name, img } 或 null（池是空的）
function drawPrize() {
  const buckets = [];
  if (prizes.length) buckets.push({ type: "text", weight: TEXT_PRIZE_WEIGHT, items: prizes });
  SERIES.forEach(s => {
    const items = s.list();
    if (items.length && s.weight > 0) buckets.push({ type: s.key, weight: s.weight, items });
  });
  const total = buckets.reduce((sum, b) => sum + b.weight, 0);
  if (!total) return null;
  let roll = Math.random() * total;
  const bucket = buckets.find(b => (roll -= b.weight) < 0) || buckets[buckets.length - 1];
  const picked = bucket.items[Math.floor(Math.random() * bucket.items.length)];
  return bucket.type === "text"
    ? { type: "text", name: picked, img: null }
    : { type: bucket.type, name: picked.name, img: picked.img };
}

// 同一個角色抽到幾次就是幾級（沿用既有的收藏陣列，舊資料不用轉檔）
function countOwned(collection, item) {
  return (collection || []).filter(c => c.type === item.type && c.name === item.name).length;
}

const defaultStudents = Array.from({length: 10}, (_, i) => ({ name: `學生 ${i+1}`, score: 0, collection: [] }));
const defaultPrizes = ["寶可夢卡片", "小玩具", "原子筆一隻", "飲料一罐", "貼紙一張"];

let students = defaultStudents;
let prizes = defaultPrizes;
let classCode = "";
let unsubscribe = null;
let saveTimer = null;

const UNLIMITED_KEY = "gacha_unlimited_mode";
// 只存密碼的 SHA-256 雜湊，不放明文，讓看原始碼也拿不到密碼本身。
// 註：純前端 App 無法做到真正保密（進階使用者仍可直接改 localStorage 繞過），
// 這裡只是把門檻提高到「看原始碼看不出密碼」的程度。
const UNLIMITED_PASSWORD_HASH = "998f04ad255d1dcc3109d576ffca45c452bc9e7ef5538ed11b29ec6e96d9825f";
let unlimitedMode = localStorage.getItem(UNLIMITED_KEY) === "1";

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function updateUnlimitedToggleLabel() {
  document.getElementById("unlimitedToggleBtn").textContent = unlimitedMode ? "♾️ 無限扭蛋模式：開啟" : "🔓 隱藏功能";
}

async function toggleUnlimitedMode() {
  if (unlimitedMode) {
    unlimitedMode = false;
    localStorage.removeItem(UNLIMITED_KEY);
    updateUnlimitedToggleLabel();
    renderStudents();
    return;
  }
  const input = prompt("請輸入專屬密碼以解鎖無限扭蛋模式：");
  if (input === null) return;
  if (await sha256Hex(input) !== UNLIMITED_PASSWORD_HASH) {
    alert("密碼錯誤");
    return;
  }
  unlimitedMode = true;
  localStorage.setItem(UNLIMITED_KEY, "1");
  updateUnlimitedToggleLabel();
  renderStudents();
}

function classDocRef(code) {
  return doc(db, "classes", code);
}

function setSyncStatus(text) {
  document.getElementById("syncStatus").textContent = text;
}

async function connectClass(code) {
  classCode = code.trim();
  if (!classCode) return;
  localStorage.setItem(CLASS_CODE_KEY, classCode);
  document.getElementById("classCodeLabel").textContent = classCode;
  if (unsubscribe) unsubscribe();
  setSyncStatus("☁️ 連線中...");

  const ref = classDocRef(classCode);
  try {
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, { students: defaultStudents, prizes: defaultPrizes });
    }
  } catch (e) {
    setSyncStatus("⚠️ 連線失敗，請檢查網路後重新整理");
    console.error(e);
    return;
  }

  unsubscribe = onSnapshot(ref, (snap) => {
    const data = snap.data();
    if (!data) return;
    students = data.students || [];
    prizes = data.prizes || [];
    renderStudents();
    setSyncStatus("☁️ 已同步");
  }, (err) => {
    setSyncStatus("⚠️ 連線失敗，請檢查網路後重新整理");
    console.error(err);
  });
}

function openClassCodeModal() {
  document.getElementById("classCodeInput").value = classCode;
  document.getElementById("classCodeModal").classList.add("show");
}
function closeClassCodeModalIfSet() {
  if (classCode) document.getElementById("classCodeModal").classList.remove("show");
}
function submitClassCode() {
  const value = document.getElementById("classCodeInput").value.trim();
  if (!value) { alert("請輸入班級代碼"); return; }
  document.getElementById("classCodeModal").classList.remove("show");
  connectClass(value);
}

const BG_MODE_KEY = "gacha_bg_mode";
const BG_IMAGE_KEY = "gacha_bg_image";
const COMIC_BG_CLASSES = ["bg-comic-1", "bg-comic-2", "bg-comic-3", "bg-comic-4", "bg-comic-5", "bg-comic-6", "bg-comic-7", "bg-comic-8", "bg-comic-9", "bg-comic-10"];

function applyBg(mode, imageDataUrl) {
  document.body.classList.remove(...COMIC_BG_CLASSES, "bg-custom");
  document.body.style.backgroundImage = "";
  if (mode === "custom" && imageDataUrl) {
    document.body.classList.add("bg-custom");
    document.body.style.backgroundImage = `url(${imageDataUrl})`;
  } else if (mode && COMIC_BG_CLASSES.includes(mode)) {
    document.body.classList.add(mode);
  }
}

function loadBgFromStorage() {
  const mode = localStorage.getItem(BG_MODE_KEY);
  const image = localStorage.getItem(BG_IMAGE_KEY);
  if (mode) applyBg(mode, image);
}

function openBgModal() {
  document.getElementById("bgModal").classList.add("show");
}
function closeBgModal() {
  document.getElementById("bgModal").classList.remove("show");
}

function uploadBgImage(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      localStorage.setItem(BG_MODE_KEY, "custom");
      localStorage.setItem(BG_IMAGE_KEY, reader.result);
      applyBg("custom", reader.result);
    } catch (e) {
      alert("圖片太大，無法儲存，請換一張較小的圖片試試");
    }
  };
  reader.readAsDataURL(file);
}

function randomComicBg() {
  const choice = COMIC_BG_CLASSES[Math.floor(Math.random() * COMIC_BG_CLASSES.length)];
  localStorage.setItem(BG_MODE_KEY, choice);
  localStorage.removeItem(BG_IMAGE_KEY);
  applyBg(choice, null);
}

function resetBg() {
  localStorage.removeItem(BG_MODE_KEY);
  localStorage.removeItem(BG_IMAGE_KEY);
  applyBg(null, null);
}

function save() {
  if (!classCode) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    setDoc(classDocRef(classCode), { students, prizes }).catch(err => {
      setSyncStatus("⚠️ 儲存失敗，請檢查網路");
      console.error(err);
    });
  }, 300);
}

function renderStudents() {
  const grid = document.getElementById("studentGrid");
  grid.innerHTML = "";
  students.forEach((s, idx) => {
    const pct = Math.min(100, Math.round((s.score / GOAL) * 100));
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <button class="remove-student" onclick="removeStudent(${idx})">✕</button>
      <input class="name-input" value="${escapeHtml(s.name)}" onchange="renameStudent(${idx}, this.value)">
      <div class="score-row">
        <div class="score-btns">
          <button class="plus" onclick="changeScore(${idx}, 1)">＋</button>
          <button class="minus" onclick="changeScore(${idx}, -1)">－</button>
        </div>
        <div class="score">${s.score}</div>
      </div>
      <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
      ${(s.score >= GOAL || unlimitedMode) ? `<button class="gacha-ready" onclick="playGacha(${idx})">🎰 扭蛋一次！${unlimitedMode ? "（無限）" : ""}</button>` : ""}
      <button class="btn-main collection-btn" onclick="openCollectionModal(${idx})">📖 扭蛋收藏圖鑑（${groupCollection(s.collection).length} 種／共 ${(s.collection || []).length} 抽）</button>
    `;
    grid.appendChild(card);
  });
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function changeScore(idx, delta) {
  students[idx].score = Math.max(0, students[idx].score + delta);
  save();
  renderStudents();
}

function renameStudent(idx, value) {
  students[idx].name = value || `學生 ${idx+1}`;
  save();
}

function addStudent() {
  students.push({ name: `學生 ${students.length+1}`, score: 0, collection: [] });
  save();
  renderStudents();
}

function removeStudent(idx) {
  if (!confirm(`確定要移除「${students[idx].name}」嗎？`)) return;
  students.splice(idx, 1);
  save();
  renderStudents();
}

function resetAllScores() {
  if (!confirm("確定要將所有學生的分數重設為 0 嗎？")) return;
  students.forEach(s => s.score = 0);
  save();
  renderStudents();
}

function playGacha(idx) {
  if (!unlimitedMode) {
    students[idx].score = Math.max(0, students[idx].score - GOAL);
  }
  save();
  renderStudents();

  const modal = document.getElementById("gachaModal");
  const capsule = document.getElementById("gachaCapsule");
  const resultEl = document.getElementById("gachaResult");
  resultEl.textContent = "";
  capsule.textContent = "🥚";
  modal.classList.add("show");

  let spins = 0;
  const maxSpins = 14;
  const icons = ["🥚", "🎁", "⭐", "🍬", "🎈"];
  const interval = setInterval(() => {
    capsule.innerHTML = icons[spins % icons.length];
    spins++;
    if (spins >= maxSpins) {
      clearInterval(interval);
      const drawn = drawPrize();
      if (!drawn) {
        capsule.textContent = "😢";
        resultEl.textContent = "獎品池是空的，請先新增獎品";
        return;
      }
      if (!students[idx].collection) students[idx].collection = [];
      const level = countOwned(students[idx].collection, drawn) + 1;
      students[idx].collection.push({ type: drawn.type, name: drawn.name, img: drawn.img, time: Date.now() });

      const who = escapeHtml(students[idx].name);
      const what = escapeHtml(drawn.name);
      if (drawn.img) {
        const series = SERIES_LABEL[drawn.type] || "角色";
        // referrerpolicy="no-referrer"：美少女戰士的圖放在 Fandom，帶 referer 會被擋成佔位圖
        capsule.innerHTML = `<img src="${drawn.img}" alt="${what}" referrerpolicy="no-referrer">`;
        resultEl.innerHTML = level > 1
          ? `${who} 又抽到${escapeHtml(series)}：${what}！`
            + `<div class="levelup-note">⭐ 重複角色升級 → Lv.${level}</div>`
          : `恭喜 ${who}！<br>抽到${escapeHtml(series)}：${what}`;
      } else {
        capsule.textContent = "🎉";
        resultEl.innerHTML = `恭喜 ${who}！<br>抽到：${what}`;
      }
      save();
      renderStudents();
    }
  }, 100);
}

// 把「每抽一次就 push 一筆」的收藏紀錄，收攏成「每個角色一格 ＋ 等級」
// 等級＝抽到的次數，最近抽到的排最前面。
function groupCollection(collection) {
  const map = new Map();
  (collection || []).forEach(item => {
    const key = `${item.type}|${item.name}`;
    const g = map.get(key);
    if (g) {
      g.level += 1;
      g.lastTime = Math.max(g.lastTime, item.time || 0);
      if (!g.img && item.img) g.img = item.img;
    } else {
      map.set(key, { type: item.type, name: item.name, img: item.img, level: 1, lastTime: item.time || 0 });
    }
  });
  return [...map.values()].sort((a, b) => b.lastTime - a.lastTime);
}

function openCollectionModal(idx) {
  const s = students[idx];
  document.getElementById("collectionTitle").textContent = `📖 ${s.name} 的扭蛋收藏圖鑑`;
  const grid = document.getElementById("collectionGrid");
  const collection = s.collection || [];
  if (!collection.length) {
    grid.innerHTML = `<div class="collection-empty">還沒有抽到任何獎品，加滿10分就能扭蛋囉！</div>`;
  } else {
    grid.innerHTML = groupCollection(collection).map(item => `
      <div class="collection-item">
        ${item.level > 1 ? `<span class="lv-badge${item.level >= 5 ? " lv-high" : ""}">Lv.${item.level}</span>` : ""}
        ${item.img ? `<img src="${item.img}" alt="${escapeHtml(item.name)}" referrerpolicy="no-referrer">` : `<div style="font-size:2rem;">🎁</div>`}
        <div>${escapeHtml(item.name)}</div>
        ${SERIES_LABEL[item.type] ? `<span class="collection-series">${escapeHtml(SERIES_LABEL[item.type])}</span>` : ""}
      </div>
    `).join("");
  }
  document.getElementById("collectionModal").classList.add("show");
}
function closeCollectionModal() {
  document.getElementById("collectionModal").classList.remove("show");
}

function closeGachaModal() {
  document.getElementById("gachaModal").classList.remove("show");
}

function openPrizeModal() {
  renderPrizeList();
  document.getElementById("prizeModal").classList.add("show");
}
function closePrizeModal() {
  document.getElementById("prizeModal").classList.remove("show");
  save();
}

function renderPrizeList() {
  const list = document.getElementById("prizeList");
  list.innerHTML = "";
  prizes.forEach((p, idx) => {
    const row = document.createElement("div");
    row.className = "prize-row";
    row.innerHTML = `
      <input value="${escapeHtml(p)}" onchange="updatePrize(${idx}, this.value)">
      <button onclick="removePrize(${idx})">✕</button>
    `;
    list.appendChild(row);
  });
}

function updatePrize(idx, value) {
  prizes[idx] = value;
}
function addPrizeRow() {
  prizes.push("新獎品");
  renderPrizeList();
}
function removePrize(idx) {
  prizes.splice(idx, 1);
  renderPrizeList();
}

Object.assign(window, {
  addStudent, removeStudent, renameStudent, changeScore, resetAllScores,
  playGacha, closeGachaModal, openPrizeModal, closePrizeModal,
  addPrizeRow, removePrize, updatePrize,
  openClassCodeModal, closeClassCodeModalIfSet, submitClassCode,
  openBgModal, closeBgModal, uploadBgImage, randomComicBg, resetBg,
  openCollectionModal, closeCollectionModal, toggleUnlimitedMode
});

renderStudents();
loadBgFromStorage();
updateUnlimitedToggleLabel();

const savedCode = localStorage.getItem(CLASS_CODE_KEY);
if (savedCode) {
  connectClass(savedCode);
} else {
  openClassCodeModal();
}
</script>
</body>
</html>
